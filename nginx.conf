server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;


    location /src/assets/ {
        proxy_pass http://rustfs.rustfs.svc.cluster.local:9000/cats-media/;
        proxy_http_version 1.1;
        proxy_set_header Host rustfs.rustfs.svc.cluster.local;
        proxy_set_header Authorization "";
        proxy_intercept_errors off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
    }
}
